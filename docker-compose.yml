# Local-first dev stack (docs/07-system-architecture.md "Deployment topology (MVP)").
# One Postgres instance, two databases (mattermost + orchestrator) -- resolves the
# open question in docs/02-prd.md Section 8 in favor of one running Postgres process,
# while keeping each service's schema fully isolated (Mattermost owns its own
# migrations and expects a dedicated database, not a shared schema).

services:
  postgres:
    image: postgres:16-alpine
    container_name: openbiolab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiscientist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./mattermost-server/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiscientist"]
      interval: 5s
      timeout: 5s
      retries: 10

  mattermost:
    image: mattermost/mattermost-team-edition:9.11
    container_name: openbiolab-mattermost
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://aiscientist:${POSTGRES_PASSWORD:-dev_only_change_me}@postgres:5432/mattermost?sslmode=disable"
      MM_SERVICESETTINGS_SITEURL: "http://localhost:8065"
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLEOAUTHSERVICEPROVIDER: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      # Outgoing Webhooks call the orchestrator at its internal Docker DNS
      # name ("orchestrator", the containerized default -- see the
      # orchestrator service below). "host.docker.internal" is also trusted
      # for the alternative host-run workflow: running the orchestrator
      # directly on the host venv instead of in this container, so it
      # inherits a `claude` CLI you're already logged into on your own
      # machine (no ANTHROPIC_API_KEY, no `docker compose exec ... claude
      # login` step -- exactly what a subscription-login dev session looks
      # like day to day). Mattermost otherwise blocks both as private-network
      # addresses (a real SSRF protection, not a bug) -- explicitly trust
      # both so either workflow works without edits here.
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: "orchestrator,host.docker.internal"
    ports:
      - "127.0.0.1:8065:8065"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mm_data:/mattermost/data
      - mm_logs:/mattermost/logs
      - mm_config:/mattermost/config
      - mm_plugins:/mattermost/plugins

  orchestrator:
    build: ./orchestrator
    container_name: openbiolab-orchestrator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORCHESTRATOR_DB_URL: "postgresql+asyncpg://aiscientist:${POSTGRES_PASSWORD:-dev_only_change_me}@postgres:5432/orchestrator"
      MATTERMOST_URL: "http://mattermost:8065"
      MATTERMOST_WEBHOOK_SECRET: ${MATTERMOST_WEBHOOK_SECRET:-}
      # Two mutually exclusive ways to authenticate the `claude` CLI
      # (app/claude_runner.py) -- pick whichever you actually have:
      #  (a) API key: set ANTHROPIC_API_KEY below, nothing else to do.
      #  (b) Claude subscription (Pro/Max), no API key: leave this blank
      #      and instead run, once, after `docker compose up -d`:
      #        docker compose exec -it orchestrator claude auth login
      #      It prints a URL -- open it in any browser, on any machine, to
      #      approve. Credentials land in the claude_config volume below and
      #      persist across restarts/rebuilds; you won't be asked again.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CREDENTIAL_VAULT_KEY: ${CREDENTIAL_VAULT_KEY:-}
    volumes:
      # Mounts the whole home dir, not just .claude/ -- a second real bug
      # found live: the CLI's auth (`claude auth login`) writes into
      # .claude/, but its own general config/onboarding state lives in a
      # SIBLING file, ~/.claude.json, which isn't under .claude/ at all.
      # With only .claude/ mounted, that file silently reset to nothing on
      # every container recreation, and a live agent run then completed
      # with zero output and no error (not even a crash) instead of a real
      # answer -- worse than fix #1's loud crash, since nothing surfaced it
      # as a failure. Mounting the parent directory covers both files with
      # one volume.
      - orchestrator_home:/home/orchestrator
      # app/config.py's experiments_dir/papers_download_dir default to
      # "../data/..." -- relative to WORKDIR /app, that's /data. A real
      # bug found live: pre-existing Experiment rows (created by an
      # earlier host-run orchestrator, where "../data" correctly resolved
      # against the host's orchestrator/ cwd) crashed the containerized
      # agent with "Working directory does not exist" the moment a
      # message landed in a channel with an already-open Experiment,
      # since /data never existed in the container at all. Bind-mounting
      # the repo's own data/ here makes the existing relative-path
      # default resolve correctly in both the host-run and containerized
      # cases, with no code change, and reuses the same host directory
      # data/README.md already documents (Databases/, Experiments/,
      # scihub.sql).
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pg_data:
  mm_data:
  mm_logs:
  mm_config:
  mm_plugins:
  orchestrator_home:
