[project]
name = "openbiolab-orchestrator"
version = "0.1.0"
description = "Routes Mattermost messages to Claude Code/Codex agents, enforces grounding on every response."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.12,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "cryptography>=43.0,<44.0",
    "claude-agent-sdk>=0.2.139,<1.0",
    # PDF text extraction (app/tools/literature_discovery.py's read_paper)
    # and the direct Messages API for its one-shot structured-extraction
    # call -- claude_agent_sdk above is for the master agent's own
    # multi-turn loop (spawns the CLI as a subprocess), too heavy for a
    # single per-paper extraction call.
    "pymupdf>=1.24,<2.0",
    "anthropic>=0.40,<1.0",
    # Wrapped, in-process bio libraries (docs/10-build-plan.md Phase 5's
    # bio.tools/GitHub triage) -- selected for being real, general-purpose,
    # actively-maintained packages, not single-paper research code.
    "scikit-bio>=0.7,<1.0",
    "biopandas>=0.5,<1.0",
    "cobra>=0.32,<1.0",
    "rdkit>=2026.3,<2027.0",
    "vina>=1.2,<2.0",
    "meeko>=0.7,<1.0",
    "gemmi>=0.7,<1.0",  # meeko's chemtempgen submodule needs this at import time but doesn't declare it
    "primer3-py>=2.0,<3.0",
    "pyhmmer>=0.12,<1.0",
    "msprime>=1.3,<2.0",
    "plip>=3.0,<4.0",
    # mhcflurry depends on torch, which by default pulls the full CUDA
    # toolkit (~2GB+, and prone to flaky downloads) even though this
    # tool only needs CPU inference. Install CPU-only torch FIRST:
    #   uv pip install torch --index-url https://download.pytorch.org/whl/cpu
    # then `uv pip install mhcflurry` reuses it instead of pulling CUDA.
    # Also requires a one-time model download after installing:
    #   .venv/bin/mhcflurry-downloads fetch models_class1_pan
    "mhcflurry>=2.0,<3.0",
    "gseapy>=1.3,<2.0",
    "gprofiler-official>=1.0,<2.0",
    "pyteomics>=4.7,<5.0",
    "piqtree>=0.7,<1.0",
    "dendropy>=5.0,<6.0",
    # CLI-first, no clean library API (its service classes read a tree
    # file and print(), not a function returning a value) -- wrapped via
    # subprocess in app/tools/phylogenetics.py's compute_tree_statistics.
    "phykit>=2.0,<3.0",
    "sourmash>=4.8,<5.0",
    # soltrannet also depends on torch -- install CPU-only torch first
    # (see mhcflurry's note above) to avoid pulling the full CUDA
    # toolkit; it reuses the CPU wheel if already installed for mhcflurry.
    "soltrannet>=1.0,<2.0",
    "equilibrator-api>=0.6,<1.0",
    # virtual_screening.py deliberately does NOT depend on the pyscreener
    # package -- it pulls in ray + openmm (~36 packages, distributed-compute
    # scale) for what this platform needs as simple batched Vina calls.
    # Reuses vina_docking.py's own internals instead; no new dependency.
    "straindesign>=1.19,<2.0",  # pulls pyscipopt (MILP solver), clean install
    # NOT added here: pegg (Synthetic biology candidate) -- hard-pins
    # scikit-learn==1.1.1, which would downgrade this venv's scikit-learn
    # (needed at >=1.9 by mhcflurry) and break an already-shipped tool.
    "nrpcalc>=1.7,<2.0",
    # docs/17-remaining-tools-wiring-plan.md Phase 1, Immunoinformatics
    # cluster -- three real local-computation packages, no external API.
    "epitopepredict>=0.5,<1.0",
    # anarci is pure Python but needs the real `hmmscan` binary (apt
    # `hmmer` package, see Dockerfile) for its HMM alignment step.
    "anarci>=2026.2.13,<2027.0",
    "tcrdist3>=0.3,<1.0",
    # docs/17-remaining-tools-wiring-plan.md Phase 1, Cheminformatics
    # cluster -- dynamic SBML kinetic simulation, complementing cobra's
    # steady-state FBA.
    "libroadrunner>=2.10,<3.0",
    # docs/17-remaining-tools-wiring-plan.md Phase 1, Population genetics
    # cluster -- real diversity statistics on caller-supplied aligned
    # sequences, no external API.
    "egglib>=3.6,<4.0",
    # docs/17-remaining-tools-wiring-plan.md Phase 1, Sequence analysis
    # cluster -- minimap2's official Python bindings, real compiled
    # aligner, no external API.
    "mappy>=2.31,<3.0",
    # docs/17-remaining-tools-wiring-plan.md Phase 1, Proteomics cluster
    # -- pure-Python PSM rescoring for FDR control, pairs with the
    # already-live pyteomics_mass.
    "mokapot>=0.10,<1.0",
    # docs/17-remaining-tools-wiring-plan.md Phase 1, Cheminformatics
    # cluster -- SMILES -> 3D conformers via RDKit isomer enumeration +
    # a neural network potential (AIMNET), closing the ChEMBL/PubChem
    # 2D-SMILES -> vina_docking 3D-input gap.
    "Auto3D>=3.0,<4.0",
    # docs/17-remaining-tools-wiring-plan.md Phase 1, Cheminformatics
    # cluster -- real protein-protein docking, complementing
    # vina_docking's small-molecule-only scope.
    "lightdock>=0.9,<1.0",
    # docs/17-remaining-tools-wiring-plan.md's Other cluster -- real
    # cBioPortal REST client, no external dependency conflicts. cptac
    # (same cluster) deliberately NOT added -- phones home to Zenodo on
    # bare import, observed to hang/504 repeatedly in this environment.
    "pybioportal>=1.0,<2.0",
    # docs/17-remaining-tools-wiring-plan.md Phase 1, Structural biology
    # cluster -- symmetry-corrected small-molecule pose RMSD, pairs with
    # vina_docking. DockQ (same shortlist row) investigated and NOT
    # added -- its numpy<2.0 pin conflicts with msprime/tskit's compiled
    # extension, which needs numpy>=2's C-API (confirmed live: DockQ
    # installed fine alone, but broke tskit's import; reinstalling
    # numpy>=2 to fix tskit then broke DockQ's own compiled extension in
    # the other direction -- a real, unresolvable-in-place conflict, not
    # a version-range nitpick).
    "spyrmsd>=0.9,<1.0",
    # docs/17-remaining-tools-wiring-plan.md Phase 1, Structural biology
    # cluster -- real Elastic Network Model dynamics (ANM) from a static
    # structure, no MD trajectory needed. PyPI metadata pins numpy<2.0
    # but confirmed live (unlike DockQ) that it's pure Python and works
    # fine against numpy>=2 -- not the same conflict.
    "correlationplus>=0.2,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
    # --forked (pytest-forked) runs each test in its own subprocess --
    # isolates the native-library memory footprint per test (RDKit, torch,
    # OpenBabel, IQ-TREE...) instead of it accumulating across a single
    # long-running process, and contains a crash in one test to that one
    # test instead of aborting the whole run. Use for a full-suite run;
    # slower than a normal run (every test pays fresh import cost), so not
    # the default for a quick single-file check during development.
    "pytest-forked>=1.6,<2.0",
    # --reruns N retries a failing test up to N times before reporting it
    # failed -- this suite hits real public APIs (NCBI, EBI, RCSB,
    # OpenAlex...) on every case, so a transient rate limit/timeout is
    # expected noise, not a regression signal. See CONTRIBUTING.md.
    "pytest-rerunfailures>=14,<17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "e2e: slow, multi-tool end-to-end chains (see orchestrator/tests/e2e/)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
